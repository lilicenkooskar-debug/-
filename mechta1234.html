<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a62f0">
<title>Мечта</title>
<style>
:root{
  --blue:#1a62f0; --blue2:#2f74f5; --blue3:#4a86f7; --glass:rgba(255,255,255,.14);
  --white:#fff; --ink:#0f1e4a; --lo:#f25b52; --mid:#ffffff; --hi:#5ed68a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--blue);color:#fff;
  max-width:520px;margin:0 auto;min-height:100vh}
main{padding:max(20px,env(safe-area-inset-top)) 18px 110px}
h1{font-size:30px;margin:8px 0 14px;font-weight:700}
h2{font-size:20px;margin:18px 0 10px;font-weight:600}
.muted{opacity:.7;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.glass{background:var(--glass);border-radius:22px;padding:16px;margin-bottom:12px}
.white{background:#fff;color:var(--ink);border-radius:22px;padding:16px;margin-bottom:12px}
.white .muted{opacity:.6}
.big{font-size:40px;font-weight:700;line-height:1.1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.two>div{margin:0}
.seg{display:flex;background:var(--glass);border-radius:999px;padding:5px;margin:14px 0}
.seg button{flex:1;border:0;background:none;color:#fff;padding:11px;border-radius:999px;font-size:15px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.28);font-weight:600}
/* таблиця оцінок */
.gt{display:grid;grid-template-columns:38% 1fr;border-radius:4px;overflow:hidden}
.gt .l{padding:18px 12px;font-size:15px;border-bottom:1px solid transparent;background:rgba(255,255,255,.06)}
.gt .l:nth-child(4n+1),.gt .r:nth-child(4n+2){background:rgba(255,255,255,.12)}
.gt .r{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:64px;border-left:2px solid rgba(255,255,255,.25)}
.subj{cursor:pointer}
.badge{min-width:50px;height:50px;border-radius:50%;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  color:#111;font-weight:700;font-size:18px;line-height:1;cursor:pointer;background:#fff}
.badge small{font-size:10px;font-weight:400;margin-top:2px;opacity:.7}
.badge.lo{background:var(--lo)}.badge.mid{background:var(--mid)}.badge.hi{background:var(--hi)}
.badge.sm{min-width:40px;height:40px;font-size:15px}
.back{background:none;border:0;color:#fff;font-size:26px;padding:0;cursor:pointer}
.btn{background:#fff;color:var(--blue);border:0;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.g{background:var(--glass);color:#fff}
.btn.red{background:#ffe1dc;color:#b42318}
.btn.full{width:100%}
.blue-btn{background:var(--blue);color:#fff}
input,select,textarea{width:100%;padding:13px;border:1px solid #d6dff5;border-radius:14px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
label{display:block;font-size:13px;opacity:.7;margin:12px 0 5px}
.modal{position:fixed;inset:0;background:rgba(5,15,60,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;color:var(--ink);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px}
.g12{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.g12 button{padding:13px 0;border:1px solid #d6dff5;border-radius:12px;background:#fff;font-size:16px;cursor:pointer;color:var(--ink)}
.g12 button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.hw{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #e6ecfb}
.hw:last-child{border:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--blue);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;margin-top:2px}
.ck.on{background:var(--blue)}
.done{text-decoration:line-through;opacity:.5}
.empty{text-align:center;opacity:.7;padding:26px 8px}
.result{background:#eaf1ff;border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
.tag{display:inline-block;font-size:11px;background:#e1ebff;color:var(--blue);border-radius:8px;padding:2px 8px}
/* Навчання: шапка, вкладки, скелетони */
.lhead{position:sticky;top:0;z-index:4;background:var(--blue);margin:-12px -18px 8px;padding:12px 18px 10px}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;border:0;border-radius:999px;padding:11px 18px;font-size:15px;font-weight:600;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
.pills button.on{background:#fff;color:var(--blue)}
.rowh{display:flex;align-items:center;justify-content:space-between}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -18px 6px;padding:0 18px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rc{flex:none;width:150px;height:116px;background:#fff;color:var(--ink);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.rc .muted{font-size:11px;opacity:.55}
.rc b{font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc>.muted{margin-top:auto}
.dotv{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#111}
.dotv.lo{background:var(--lo)}.dotv.mid{background:var(--mid)}.dotv.hi{background:var(--hi)}
.btn.ghost{background:none;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.wk{text-align:center;margin:6px 0 14px}
.rnd{width:30px;height:30px;border:1.5px solid #fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;padding-bottom:3px}
.drop{display:inline-block;margin-top:8px;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:3px 14px;font-size:14px}
.sk{border-radius:22px;background:linear-gradient(100deg,rgba(255,255,255,.12) 30%,rgba(255,255,255,.26) 50%,rgba(255,255,255,.12) 70%);background-size:300% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-150% 0}}
.skc{display:flex;gap:14px;padding:18px;height:120px;margin-bottom:12px}
.skc i{width:46px;height:20px;border-radius:999px;flex:none;background:rgba(255,255,255,.22)}
.skc div{flex:1;display:flex;flex-direction:column;gap:13px}
.skc b{height:12px;border-radius:999px;background:rgba(255,255,255,.22)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;--cut:#5b97f7;
  background:linear-gradient(rgba(130,180,255,.6),rgba(80,140,250,.85));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;padding:10px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:#000;font-size:11px;font-weight:700;padding:4px 0;cursor:pointer;font-family:inherit}
nav button .ic{display:block;margin:0 auto 4px;width:28px;height:28px}
nav button.on{color:#fff}
nav svg{width:28px;height:28px;fill:currentColor;display:block}
.rbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#d99cf5,#b87cf0);position:relative;display:inline-block}
.logo i{position:absolute;right:-6px;bottom:-5px;background:#ffc98a;color:#000;font:700 10px system-ui;border-radius:5px;padding:1px 4px}
[data-hold]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.desc{font-size:16px;line-height:1.35;opacity:.9;margin:-2px 0 14px}
.gt .l.tw{display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer;font-size:15px}
.up{color:var(--hi);font-weight:700}.dn{color:#ff7a6b;font-weight:700}
.sq{min-width:54px;height:60px;border-radius:18px;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0 6px}
.sq span{font-size:20px;font-weight:600}.sq small{font-size:10px;opacity:.6}.sq small.tl{opacity:.75;font-size:10px}
.sq.lo{background:#ff8a65}
.mhead{margin:0 -18px 16px;padding:0 18px 12px;border-bottom:2px solid rgba(255,255,255,.3)}
.mcard{background:rgba(255,255,255,.18);border-radius:26px;padding:2px 18px;margin-bottom:18px}
.mrow{display:flex;align-items:center;gap:14px;padding:19px 0;border-bottom:1px solid rgba(255,255,255,.22);font-size:17px;font-weight:500}
.mrow:last-child{border:0}.mrow svg{width:26px;height:26px;fill:#fff;flex:none}.mrow span{flex:1}
.mrow svg.chev{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.exit{display:inline-block;margin:56px auto 18px;padding:20px 62px;border-radius:999px;border:2px solid rgba(255,255,255,.45);background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.04));font-size:24px;font-weight:600}
.ver{font-size:15px}
h1{font-size:25px;font-weight:500}
h2{font-size:21px;font-weight:500;margin:26px 0 12px}
.lhead{border-bottom:1.5px solid rgba(255,255,255,.22);margin-bottom:14px}
.pills button{font-weight:500;padding:10px 17px}
.gt.bleed{margin:0 -18px;border-radius:0}
.gt.bleed .l{padding-left:18px;font-weight:400}
.gt.bleed .r{border-left:2px solid rgba(255,255,255,.4)}
.btn.ghost{display:block;margin:22px auto 6px;width:auto;padding:15px 34px;border-radius:999px;font-weight:500;font-size:17px}
.rc{width:162px;height:118px;border-radius:20px;padding:12px 13px}
.rc b{font-weight:500;font-size:14px}
.att{background:#fff;color:var(--ink);border-radius:28px;padding:20px;display:flex;align-items:center;gap:18px}
.at1{font-size:19px;font-weight:500}.at2{font-size:19px;font-weight:500;margin:2px 0 6px}
.att .muted{color:#667;opacity:1;font-size:14px}
.hwc{flex:none;width:218px;background:#fff;color:var(--ink);border-radius:28px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:20px}
.hwc h3{margin:0;font-size:21px;font-weight:500;line-height:1.15;min-height:48px}
.hwl{font-size:15px;font-weight:600}
.hwc .sub{font-size:14px;color:#6b7896;margin-top:2px}
.dash{color:#2f6df0;font-size:32px;font-weight:700;line-height:1;margin-top:8px}.dash.sm{font-size:22px;margin:0}
.rowx{display:flex;justify-content:space-between;align-items:flex-start}
.days{display:flex;justify-content:space-between}.days div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.days i{width:24px;height:24px;border-radius:50%;border:4px solid #b9cef6}
.sq.pill{min-width:76px;border-radius:30px}
.sc{border-radius:26px;padding:18px 18px 16px;margin:0}
.sc .st{font-size:16px;font-weight:500}.sc .sv{font-size:36px;font-weight:500;margin:10px 0 4px}.sc .muted{opacity:1;color:#6b7896;font-size:14px}
.info{width:26px;height:26px;border-radius:50%;background:#1a62f0;color:#fff;font:italic 700 15px Georgia,serif;display:inline-flex;align-items:center;justify-content:center}
.usi{font-size:17px;font-weight:500}
.two{gap:10px}
.sc .st{font-size:15px;white-space:nowrap}.gt.bleed>.l{display:flex;align-items:center}
.rnd{cursor:pointer;user-select:none}.rnd.dis{opacity:.3}
[data-hold],[data-hold] *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gwrap{position:relative;margin:0 -18px}.gwrap .gt.bleed{margin:0}
.stamp{position:absolute;left:70%;top:230px;transform:translate(-50%,0);width:190px;height:190px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stamp svg{position:absolute;inset:0}.stamp span{position:relative;transform:rotate(-8deg);font-size:19px;font-weight:500;text-align:center;width:130px;line-height:1.25}
/* точніше під зразок */
.gt.bleed{grid-template-columns:40% 1fr}
.gt.bleed>.l{padding:0 14px 0 18px;min-height:56px;font-size:15px}
.gt.bleed>.r{padding:3px 10px;min-height:56px;gap:8px;flex-wrap:wrap;align-content:center}
.sq{min-width:56px;height:auto;min-height:50px;border-radius:22px;padding:4px 9px}
.sq span{font-size:19px;font-weight:500;display:flex;align-items:center}
.sq small{font-size:10px;opacity:.65}.sq small.tl{font-size:10px}
.sq.lo{background:#f25b52}.sq.lo small{color:#4a100c;opacity:.75}.sq.hi{background:#5ed68a}.sq.hi small{color:#0d3a1f;opacity:.75}.dotv.mid{background:#e3e9f8}
.sq.pill{min-width:62px;border-radius:24px}
.up{font-size:17px}.dn{font-size:17px}
.sq span{font-weight:400!important}.dotv{font-weight:500}.badge,.badge.sm{font-weight:400}
/* довша й приплюснута обводка, тонші цифри */
.sq{min-width:64px;min-height:46px;border-radius:26px;padding:3px 10px}
.sq span{font-weight:400;font-size:19px}
.sq small{font-size:10px}
.sq.pill{min-width:78px;border-radius:26px}
.gt.bleed>.r{padding:5px 8px;min-height:56px;gap:6px}
/* форма як у прикладі «7» */
.sq{min-width:66px;min-height:52px;border-radius:26px/50%;padding:3px 10px}
.sq span{font-weight:600;font-size:19px;line-height:1.15}
.sq small{font-size:11px;color:#5a5f6b;opacity:1;line-height:1.15}
.sq.lo small,.sq.hi small{opacity:.8}
.sq.pill{min-width:72px;border-radius:26px/50%}
/* ===== Усі оцінки: стиль таблиці як у застосунку ===== */
.ahead{margin-bottom:6px}
.gt.all{grid-template-columns:41% 1fr;margin-bottom:8px}
.gt.all>.l,.gt.all>.r{background:none;border-bottom:0}
.gt.all>.l:nth-child(4n+1),.gt.all>.r:nth-child(4n+2){background:rgba(255,255,255,.1)}
.gt.all>.l{min-height:60px;padding:6px 12px 6px 18px;font-size:14px;line-height:1.2;gap:8px}
.gt.all>.l span{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.gt.all>.r{min-height:60px;border-left:2px solid rgba(255,255,255,.45);padding:5px 8px;gap:8px}
.gt.all .tr{width:18px;height:18px;flex:none;fill:none;stroke:#5ee0b4;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gt.all .tr.dn{stroke:#ff7a6b}
.gt.all .sq{background:#fff}
.gt.all .sq.lo{background:#f98660}.gt.all .sq.lo small{color:#4a1a0c}
.gt.all .sq.hi{background:#5ed68a}
.stamp{top:150px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modalRoot"></div>

<script>
/* ===== Дані ===== */
const KEY="mechta_tracker_v3",OLD_KEY="mechta_tracker_v2";
const TYPES=["Поточна","Домашнє","Контрольна","Підсумкова"];
const DEF=["Алгебра","Геометрія","Хімія","Англійська мова","Географія","Мистецтво","ОІОТ","Біологія","Історія","Право","Українська мова","Українська література","Фізична культура","Зарубіжна література","ОБЖ"];
const ALIAS={"Правознавство":"Право","Інтегрований курс «Мистецтво»":"Мистецтво","Інтегрований курс історії та громадянської освіти":"Історія","Інтегрований курс «Здоров'я, безпека та добробут»":"ОБЖ","Інформатика":"ОІОТ"};
function load(){
  try{
    const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);
    const o=localStorage.getItem(OLD_KEY);
    if(o){ // перенесення оцінок зі старого списку предметів
      const d=JSON.parse(o),used=new Set();
      const subjects=DEF.map((n,i)=>{const m=d.subjects.find(x=>!used.has(x.id)&&(ALIAS[x.name]||x.name)===n);if(m)used.add(m.id);return {id:m?m.id:"s"+i,name:n,grades:m?m.grades:[]}});
      d.subjects.forEach(x=>{if(!used.has(x.id)&&x.grades.length)subjects.push(x)});
      return {...d,subjects,homework:d.homework||[],news:d.news||[]};
    }
  }catch(e){}
  return {subjects:DEF.map((n,i)=>({id:"s"+i,name:n,grades:[]})),homework:[],news:[]};
}
let db=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const avgOf=g=>g.length?g.reduce((a,b)=>a+b.value,0)/g.length:null;
const fmt=n=>n==null?"—":(Math.round(n*10)/10).toString().replace(".",",");
const cls=v=>v<=6?"lo":v<=9?"mid":"hi";
const isoLoc=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>isoLoc(new Date());
const daysAgo=n=>isoLoc(new Date(Date.now()-n*864e5));
const dm=d=>{const[y,m,dd]=d.split("-");return dd+"."+m};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const subj=id=>db.subjects.find(s=>s.id===id);

/* ===== Стан ===== */
let mainTab="learning"; // "home" | "learning" | "interesting" | "menu"
let tab="res",sub=null,openId=null,subTab="all",setPage=null;

function render(){
  // 4 вкладки внизу: Головне, Навчання, Цікаве, Меню
  const T=[
    ["home",`<svg viewBox="0 0 28 28"><path d="M14 2.5l9 5.2c.8.5 1.3 1.3 1.3 2.2V21c0 2-1.6 3.5-3.5 3.5H7.2c-2 0-3.5-1.5-3.5-3.5V9.9c0-.9.5-1.7 1.3-2.2z"/><circle cx="10.3" cy="14" r="1.1" fill="var(--cut)"/><circle cx="17.7" cy="14" r="1.1" fill="var(--cut)"/><path d="M10.5 17.8q3.5 2.6 7 0" stroke="var(--cut)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`,"Головне"],
    ["learning",`<svg viewBox="0 0 28 28"><rect x="4.5" y="2.5" width="19" height="23" rx="4.5"/><circle cx="10" cy="9" r="2.3" fill="var(--cut)"/><rect x="8" y="15" width="12" height="1.8" rx=".9" fill="var(--cut)"/><rect x="8" y="19" width="8" height="1.8" rx=".9" fill="var(--cut)"/></svg>`,"Навчання"],
    ["interesting",`<svg viewBox="0 0 28 28"><rect x="3.5" y="3" width="21" height="22" rx="4.5"/><rect x="3.5" y="7.5" width="21" height="1.6" fill="var(--cut)"/><path d="M8.5 12.5v6l4.5-3z" fill="var(--cut)"/><rect x="15" y="13" width="6" height="1.7" rx=".8" fill="var(--cut)"/><rect x="15" y="17" width="6" height="1.7" rx=".8" fill="var(--cut)"/></svg>`,"Цікаве"],
    ["menu",`<svg viewBox="0 0 28 28"><rect x="3.5" y="6" width="21" height="2.8" rx="1.4"/><rect x="3.5" y="12.6" width="21" height="2.8" rx="1.4"/><rect x="3.5" y="19.2" width="21" height="2.8" rx="1.4"/></svg>`,"Меню"]
  ];
  
  $("#nav").innerHTML=T.map(t=>`<button class="${mainTab===t[0]?"on":""}" onclick="goMain('${t[0]}')"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("");

  if(mainTab==="home"){
    $("#app").innerHTML=vStaticHome();
  } else if(mainTab==="interesting"){
    $("#app").innerHTML=vStaticInteresting();
  } else if(mainTab==="menu"){
    $("#app").innerHTML=vStaticMenu();
  } else {
    // Навчання
    $("#app").innerHTML=lView();
  }
}

function goMain(t){
  mainTab=t;
  openId=null;
  sub=null;
  setPage=null;
  render();
  window.scrollTo(0,0);
}

/* ===== Утримання 8 секунд: додати / змінити оцінку ===== */
let holdT=null,holdXY=[0,0],held=false;
function holdAct(v){const p=v.split(":");
  if(p[0]==="add")gradeModal(p[1]);
  else if(p[0]==="edit")gradeModal(p[1],p[2]);
  else if(p[0]==="set"){mainTab="learning";tab="res";sub=null;openId=null;setPage="set";render();window.scrollTo(0,0)}}
const holdStop=()=>{clearTimeout(holdT);holdT=null};
const holdEl=t=>{const n=t&&(t.nodeType===1?t:t.parentElement);return n&&n.closest?n.closest("[data-hold]"):null};
function holdStart(el,x,y){held=false;holdStop();holdXY=[x,y];
  holdT=setTimeout(()=>{holdT=null;held=true;try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}holdAct(el.dataset.hold)},8000)}
const holdMove=(x,y)=>{if(holdT&&Math.hypot(x-holdXY[0],y-holdXY[1])>24)holdStop()};
document.addEventListener("pointerdown",e=>{const el=holdEl(e.target);if(el)holdStart(el,e.clientX,e.clientY);else{held=false;holdStop()}});
document.addEventListener("touchstart",e=>{const el=holdEl(e.target);if(el&&e.touches.length===1)holdStart(el,e.touches[0].clientX,e.touches[0].clientY);else if(e.touches.length>1)holdStop()},{passive:true});
document.addEventListener("pointerup",holdStop);
document.addEventListener("pointercancel",e=>{if(e.pointerType!=="touch")holdStop()});
["touchend","touchcancel"].forEach(ev=>document.addEventListener(ev,holdStop,{passive:true}));
document.addEventListener("pointermove",e=>{if(e.pointerType!=="touch")holdMove(e.clientX,e.clientY)});
document.addEventListener("touchmove",e=>{if(e.touches[0])holdMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
document.addEventListener("click",e=>{if(held){held=false;e.stopPropagation();e.preventDefault()}},true);
document.addEventListener("contextmenu",e=>{if(holdEl(e.target))e.preventDefault()});
document.addEventListener("selectstart",e=>{if(holdEl(e.target))e.preventDefault()});

const sqBadge=(sid,g,pill)=>`<div class="sq ${g.value<=6?"lo":g.value>=10?"hi":""}${pill?" pill":""}" data-hold="edit:${sid}:${g.id}">${!pill&&typeLbl[g.type]?`<small class="tl">${typeLbl[g.type]}</small>`:""}<span>${g.value}${g.note?` <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="margin-left:3px;vertical-align:-1px"><path d="M12 2C6.5 2 2 5.800 2 10.500c0 2.400 1.200 4.500 3 6L4 21.500l4.800-2.600c.7.100 1.500.2 2.200.2 5.500 0 10-3.800 10-8.600S17.500 2 12 2z"/></svg>`:""}</span><small>${dm(g.date)}</small></div>`;
let wkOff=0;
const isoL=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function weekRange(off){
  const d=new Date();d.setHours(12);const wd=(d.getDay()+6)%7;
  const a=new Date(d);a.setDate(d.getDate()-wd+7*off);const b=new Date(a);b.setDate(a.getDate()+6);
  return {from:isoL(a),to:isoL(b),label:a.getDate()+"."+(a.getMonth()+1)+" Пн – "+b.getDate()+"."+(b.getMonth()+1)+" Нд"};
}
function trend(s,w){
  const nw=s.grades.filter(g=>g.date>=w.from&&g.date<=w.to),old=s.grades.filter(g=>g.date<w.from);
  if(!nw.length)return "";
  return avgOf(nw)>=(old.length?avgOf(old):7)?`<span class="up">↗</span>`:`<span class="dn">↘</span>`;
}

  const recent=flat.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const rank=s=>s.grades.some(inW)?2:s.grades.length?1:0;
  const ordered=db.subjects.map((s,i)=>({s,i,r:rank(s)})).sort((a,b)=>(b.r-a.r)||(a.i-b.i)).slice(0,8).map(x=>x.s);

function stampSvg(){
  let pts=[];for(let a=0;a<360;a+=2){const r=74+4*Math.sin(a*Math.PI/180*22);pts.push((90+r*Math.cos(a*Math.PI/180)).toFixed(1)+","+(90+r*Math.sin(a*Math.PI/180)).toFixed(1))}
  return `<svg viewBox="0 0 180 180" width="190" height="190"><polygon points="${pts.join(" ")}" fill="rgba(255,255,255,.12)"/></svg>`;

function vSubject(){

    :`<div class="white" style="margin-top:18px">${sorted.length?sorted.map(g=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #e6ecfb" data-hold="edit:${s.id}:${g.id}"><div><b>${dm(g.date)}</b> <span class="tag">${g.type}</span>${g.note?`<div class="muted">${esc(g.note)}</div>`:""}</div><div class="badge sm ${cls(g.value)}">${g.value}</div></div>`).join(""):`<div class="empty" style="color:#667">Оцінок немає</div>`}</div>`;

  <div class="two"><div class="white sc"><div class="row"><span class="st">Середній бал</span><span class="info">i</span></div><div class="sv">${fmt(avgOf(s.grades))}</div><div class="muted">14 днів тому: ${fmt(avgOf(old))}</div></div>
  <div class="white sc"><div class="st">Виконані ДЗ</div><div class="sv">0/0</div><div class="muted">за цей семестр</div></div></div>
  <div class="seg"><button class="${subTab==="all"?"on":""}" onclick="subTab='all';render()">Загальне</button><button class="${subTab==="lessons"?"on":""}" onclick="subTab='lessons';render()">По уроках</button></div>
  ${body}
  <div class="rowh"><h2>Домашні завдання</h2><span class="usi">Усі ›</span></div><div class="hscroll">${hwCard("Цього тижня")}${hwCard("Минулого тижня")}</div>`;
}
let target=10;
function whatIf(s){
  const sum=s.grades.reduce((a,b)=>a+b.value,0),c=s.grades.length;
  const rows=[12,11,10,9,8].map(v=>{
    if(v<=target)return `<div class="row" style="padding:7px 0"><span>Оцінки по ${v}</span><span class="muted">не підніме до ${fmt(target)}</span></div>`;
    const n=Math.max(0,Math.ceil((target*c-sum)/(v-target)-1e-9));
    return `<div class="row" style="padding:7px 0"><span>Оцінки по <b>${v}</b></span><b>${n===0?"вже досягнуто":n+" шт."}</b></div>`}).join("");
  return `<div class="white"><b>Калькулятор «що якщо»</b><div class="muted">Скільки оцінок потрібно, щоб підняти середній бал. Реальні оцінки не змінюються.</div>
  <label style="color:#000">Бажаний середній бал: <b>${fmt(target)}</b></label><input type="range" min="2" max="12" step="0.5" value="${target}" oninput="target=+this.value;render()">
  <div class="result">Зараз: <b>${fmt(avgOf(s.grades))}</b> · оцінок: ${c}</div>${c?rows:`<div class="empty" style="color:#667">Додай хоча б одну оцінку</div>`}</div>`;
}
function gradeModal(sid,gid){
  const s=sid?subj(sid):null;
  if(!s&&!db.subjects.length){alert("Спочатку додай предмет у налаштуваннях");return}
  const g=gid?s.grades.find(x=>x.id===gid):{value:10,date:today(),type:"Поточна",note:""};let val=g.value;
  $("#modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>${gid?"Редагувати оцінку":"Нова оцінка"}</h3>
  ${s?`<div class="muted">${esc(s.name)}</div>`:`<label style="color:#000">Предмет</label><select id="gS">${db.subjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>`}
  <label style="color:#000">Оцінка (1–12)</label><div class="g12" id="g12">${Array.from({length:12},(_,i)=>`<button data-v="${i+1}" class="${i+1===val?"on":""}">${i+1}</button>`).join("")}</div>
  <label style="color:#000">Тип</label><select id="gT">${TYPES.map(t=>`<option ${t===g.type?"selected":""}>${t}</option>`).join("")}</select>
  <label style="color:#000">Дата</label><input type="date" id="gD" value="${g.date}">
  <label style="color:#000">Нотатка</label><input id="gN" value="${esc(g.note||"")}" placeholder="необов'язково">
  <div class="row" style="margin-top:16px;gap:8px">${gid?`<button class="btn red" id="gX">Видалити</button>`:""}<button class="btn" style="background:#eaf1ff" onclick="closeM()">Скасувати</button><button class="btn blue-btn" style="flex:1" id="gOk">Зберегти</button></div></div></div>`;
  $("#g12").onclick=e=>{const b=e.target.closest("button");if(!b)return;val=+b.dataset.v;document.querySelectorAll("#g12 button").forEach(x=>x.classList.toggle("on",+x.dataset.v===val))};
  $("#gOk").onclick=()=>{const o={id:gid||uid(),value:val,type:$("#gT").value,date:$("#gD").value||today(),note:$("#gN").value.trim()};
    if(gid)Object.assign(g,o);else (s||subj($("#gS").value)).grades.push(o);save();closeM();render()};
  if(gid)$("#gX").onclick=()=>{s.grades=s.grades.filter(x=>x.id!==gid);save();closeM();render()};
}
function closeM(){$("#modalRoot").innerHTML=""}

/* ===== Налаштування (з Результатів) ===== */
const setBack=t=>`<div class="row" style="margin-top:6px"><button class="back" onclick="setPage=null;render()">←</button></div><h1>${t}</h1>`;
function vSet(){
  return setBack("Налаштування")+`<div class="white"><b>Предмети</b><div class="muted">Редагування предметів та оцінок, офлайн.</div>
  ${db.subjects.map(s=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #e6ecfb"><span style="flex:1">${esc(s.name)}</span>
    <button class="btn" style="background:#eaf1ff;padding:8px 11px" onclick="openS('${s.id}')">Оцінки</button>
    <button class="btn" style="background:#eaf1ff;padding:8px 11px" onclick="renS('${s.id}')">✏️</button>
    <button class="btn red" style="padding:8px 11px" onclick="delS('${s.id}')">🗑</button></div>`).join("")}
  <button class="btn blue-btn full" style="margin-top:12px" onclick="addS()">+ Додати предмет</button></div>
  <div class="white"><b>Дані</b><div class="muted">Усе зберігається тільки на цьому пристрої. Інтернет не потрібен.</div>
  <div class="row" style="gap:8px;margin-top:10px"><button class="btn" style="flex:1;background:#eaf1ff" onclick="exp()">Експорт</button><button class="btn" style="flex:1;background:#eaf1ff" onclick="$('#imp').click()">Імпорт</button></div>
  <input type="file" id="imp" accept="application/json" style="display:none" onchange="imp(this)">
  <button class="btn red full" style="margin-top:10px" onclick="resetAll()">Стерти всі оцінки</button></div>`;
}
function addS(){const n=prompt("Назва предмета:");if(n&&n.trim()){db.subjects.push({id:uid(),name:n.trim(),grades:[]});save();render()}}
function renS(id){const s=subj(id),n=prompt("Нова назва:",s.name);if(n&&n.trim()){s.name=n.trim();save();render()}}
function delS(id){if(confirm("Видалити предмет разом з оцінками?")){db.subjects=db.subjects.filter(x=>x.id!==id);save();render()}}
function resetAll(){if(confirm("Стерти всі оцінки?")){db.subjects.forEach(s=>s.grades=[]);save();render()}}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:"application/json"}));a.download="mechta-backup.json";a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.subjects))throw 0;d.homework=d.homework||[];d.news=d.news||[];db=d;save();render()}catch(e){alert("Не вдалося прочитати файл")}};r.readAsText(f)}

/* Демо-оцінки 8–11 (один раз) */
function seedDemo(){
  try{if(localStorage.getItem("mechta_seed_v1"))return;}catch(e){}
  db.subjects.forEach((s,i)=>{
    const n=5+(i%3);let r=(i+3)*7919;const rnd=()=>(r=(r*1103515245+12345)%2147483648)/2147483648;
    for(let k=0;k<n;k++){
      const d=new Date();d.setHours(12);d.setDate(d.getDate()-((k*5+(i*2)%5)%27));
      if(d.getDay()===0)d.setDate(d.getDate()-2);if(d.getDay()===6)d.setDate(d.getDate()-1);
      const type=k===n-1&&i%3===0?"Підсумкова":k%5===2?"Контрольна":k%5===4?"Домашнє":"Поточна";
      s.grades.push({id:uid(),value:8+Math.floor(rnd()*4),type,date:isoL(d),note:""});
    }
  });
  save();try{localStorage.setItem("mechta_seed_v1","1")}catch(e){}
}
function trimDemo(){ // один раз прибрати 80% оцінок
  try{if(localStorage.getItem("mechta_trim_v1"))return;}catch(e){}
  let n=0;db.subjects.forEach(s=>{s.grades=s.grades.filter(()=>n++%5===0)});
  save();try{localStorage.setItem("mechta_trim_v1","1")}catch(e){}
}

/* свайп вліво/вправо = інший тиждень (Усі оцінки) */
let swX=null,swY=0;
document.addEventListener("touchstart",e=>{const t=e.target.closest&&e.target.closest("#gw");swX=t&&e.touches.length===1?e.touches[0].clientX:null;swY=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(swX==null)return;const t=e.changedTouches[0],dx=t.clientX-swX,dy=t.clientY-swY;swX=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2&&sub==="all"){if(dx>0)wkOff--;else if(wkOff<0)wkOff++;else return;render()}},{passive:true});
seedDemo();trimDemo();
render();
</script>
